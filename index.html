<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas ESFEUS Ferramentaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #eef1f5; padding: 16px; color: #222; }
  .app { max-width: 1300px; margin: 0 auto; }

  .config-bar { background: #fff; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.06); flex-wrap: wrap; }
  .config-bar label { font-weight: bold; white-space: nowrap; }
  .config-bar input { flex: 1; min-width: 200px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 12px; }

  .container { display: grid; grid-template-columns: 400px 1fr; gap: 16px; }
  @media (max-width: 950px) { .container { grid-template-columns: 1fr; } }

  .panel { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { font-size: 14px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #1e5aa8; color: #1e5aa8; }
  .panel h2:not(:first-child) { margin-top: 16px; }

  /* Lista de etiquetas */
  .label-list { max-height: 220px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 10px; }
  .label-item { padding: 8px 10px; border-bottom: 1px solid #e5e5e5; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .label-item:last-child { border-bottom: none; }
  .label-item:hover { background: #f5f7fa; }
  .label-item.active { background: #1e5aa8; color: white; }
  .label-item .info { flex: 1; overflow: hidden; }
  .label-item .info-os { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label-item .info-desc { font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label-item .btn-delete { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 0 6px; line-height: 1; }
  .label-item.active .btn-delete { color: white; }
  .empty-list { padding: 20px; text-align: center; color: #999; font-size: 12px; }

  .btn-add { width: 100%; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; margin-bottom: 12px; }
  .btn-add:hover { background: #16a34a; }

  /* Formulário */
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-bottom: 3px; letter-spacing: .3px; }
  .field input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .field input:focus { outline: none; border-color: #1e5aa8; }
  .field input:disabled { background: #f5f5f5; color: #aaa; }
  .row { display: grid; gap: 8px; }
  .row-2 { grid-template-columns: 1fr 1fr; }

  /* Botões */
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
  .btn-primary { background: #1e5aa8; color: white; }
  .btn-primary:hover { background: #164380; }
  .btn-secondary { background: #555; color: white; }
  .btn-secondary:hover { background: #333; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }

  /* Preview */
  .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .etiqueta { border: 2px solid #000; background: white; width: 100%; max-width: 480px; }
  .etiqueta table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .etiqueta td { border: 1px solid #000; padding: 6px 4px; text-align: center; vertical-align: middle; font-size: 12px; word-wrap: break-word; }
  .etiqueta .hdr { background: #d9d9d9; font-weight: bold; font-size: 11px; }
  .etiqueta .title { font-size: 15px; font-weight: bold; text-decoration: underline; padding: 12px; }
  .etiqueta .logo-cell { padding: 6px; }
  .etiqueta .logo-cell .logo-img { display: block; width: 100%; max-width: 170px; height: auto; margin: 0 auto; }
  .etiqueta .data { min-height: 30px; font-weight: bold; }

  .qr-preview { text-align: center; padding: 14px; border: 1px dashed #bbb; border-radius: 4px; background: white; }
  .qr-preview #qrcode { display: inline-block; }
  .qr-preview canvas, .qr-preview img { display: block; margin: 0 auto; }
  .qr-preview .qr-label { font-size: 12px; margin-top: 8px; color: #555; }

  /* Modo visualizador (cliente escaneou) */
  body.viewer-mode { padding: 10px; background: #f0f0f0; }
  body.viewer-mode .app { max-width: 500px; }
  body.viewer-mode #config-bar, body.viewer-mode #left-panel { display: none; }
  body.viewer-mode .container { grid-template-columns: 1fr; }
  body.viewer-mode #preview-panel { padding: 8px; background: transparent; box-shadow: none; }
  body.viewer-mode #preview-panel h2 { display: none; }
  body.viewer-mode .qr-preview { display: none; }
  body.viewer-mode .viewer-footer { display: block; text-align: center; margin-top: 14px; font-size: 11px; color: #777; }
  .viewer-footer { display: none; }

  /* Área de impressão — escondida na tela */
  #print-area { display: none; }

  @media print {
    body { padding: 0; background: white; }
    .app, .config-bar { display: none !important; }
    #print-area { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8mm; padding: 8mm; }
    #print-area.single { grid-template-columns: 1fr; place-items: center; padding: 20mm; }
    .print-qr { text-align: center; page-break-inside: avoid; padding: 4mm; }
    .print-qr .qr-container { display: flex; justify-content: center; }
    .print-qr .qr-container canvas, .print-qr .qr-container img { display: block; width: 100%; max-width: 45mm; height: auto; }
    #print-area.single .print-qr .qr-container canvas, #print-area.single .print-qr .qr-container img { max-width: 90mm; }
    .print-qr .qr-info { font-size: 9px; margin-top: 3mm; color: #000; line-height: 1.3; }
    .print-qr .qr-info strong { display: block; font-size: 11px; margin-bottom: 1mm; }
    #print-area.single .print-qr .qr-info { font-size: 12px; margin-top: 6mm; }
    #print-area.single .print-qr .qr-info strong { font-size: 16px; }
    @page { margin: 0; size: A4; }
  }
</style>
</head>
<body>
<div class="app">

<div class="config-bar" id="config-bar">
  <label>URL do visualizador:</label>
  <input type="text" id="base-url" placeholder="https://kajotasousa-max.github.io/etiqueta-esfeus/">
  <button class="btn-secondary" onclick="saveBaseUrl()">Salvar URL</button>
</div>

<div class="container">

  <!-- ESQUERDA: Lista + Editor -->
  <div class="panel" id="left-panel">
    <h2>Etiquetas cadastradas</h2>
    <div class="label-list" id="label-list"></div>
    <button class="btn-add" onclick="addLabel()">+ Nova etiqueta</button>

    <h2>Dados da etiqueta selecionada</h2>

    <div class="row row-2">
      <div class="field"><label>CLIENTE</label><input id="f-cli" oninput="updateCurrent()"></div>
      <div class="field"><label>OS</label><input id="f-os" oninput="updateCurrent()"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>QUANTIDADE</label><input id="f-qty" oninput="updateCurrent()"></div>
      <div class="field"><label>DESCRIÇÃO</label><input id="f-desc" oninput="updateCurrent()"></div>
    </div>
    <div class="field"><label>Nº DO DESENHO</label><input id="f-des" oninput="updateCurrent()"></div>
    <div class="field">
      <label>TIPO DE EMBALAGEM</label>
      <input id="f-emb" oninput="updateCurrent()" list="embalagem-opcoes" placeholder="Ex.: caixa de madeira">
      <datalist id="embalagem-opcoes">
        <option value="Caixa de madeira">
        <option value="Caixa de papelão">
        <option value="Engradado de madeira">
        <option value="Pallet">
        <option value="Filme plástico">
        <option value="Sacola plástica">
        <option value="A granel">
        <option value="Big bag">
      </datalist>
    </div>
    <div class="row row-2">
      <div class="field"><label>ORDEM DE COMPRA</label><input id="f-oc" oninput="updateCurrent()"></div>
      <div class="field"><label>ITEM</label><input id="f-it" oninput="updateCurrent()"></div>
    </div>
    <div class="row row-2">
      <div class="field"><label>NOTA FISCAL</label><input id="f-nf" oninput="updateCurrent()"></div>
      <div class="field"><label>DATA</label><input id="f-dt" oninput="updateCurrent()"></div>
    </div>

    <div class="buttons">
      <button class="btn-primary" onclick="printCurrent()">Imprimir QR atual</button>
      <button class="btn-primary" onclick="printAll()">Imprimir todos os QRs</button>
      <button class="btn-secondary" onclick="copyLink()">Copiar link</button>
      <button class="btn-danger" onclick="clearAll()">Limpar tudo</button>
    </div>
  </div>

  <!-- DIREITA: Preview -->
  <div class="panel" id="preview-panel">
    <h2>Preview</h2>
    <div class="preview-wrap">
      <div class="etiqueta" id="etiqueta">
        <table>

          <tr>
            <td class="data" id="v-cli"></td>
            <td class="data" id="v-os"></td>
            <td class="data" id="v-qty" colspan="2"></td>
          </tr>
          <tr class="hdr">
            <td>DESCRIÇÃO</td><td colspan="3">Nº DO DESENHO</td>
          </tr>
          <tr>
            <td class="data" id="v-desc"></td>
            <td class="data" id="v-des" colspan="3"></td>
          </tr>
          <tr class="hdr">
            <td colspan="4">TIPO DE EMBALAGEM</td>
          </tr>
          <tr>
            <td class="data" id="v-emb" colspan="4"></td>
          </tr>
          <tr class="hdr">
            <td>ORDEM DE COMPRA</td><td>ITEM</td><td>NOTA FISCAL</td><td>DATA</td>
          </tr>
          <tr>
            <td class="data" id="v-oc"></td>
            <td class="data" id="v-it"></td>
            <td class="data" id="v-nf"></td>
            <td class="data" id="v-dt"></td>
          </tr>
        </table>
      </div>

      <div class="qr-preview">
        <div id="qrcode"></div>
        <div class="qr-label" id="qr-label">— </div>
      </div>
    </div>
    <div class="viewer-footer">Etiqueta digital ESFEUS Ferramentaria</div>
  </div>

</div>
</div>

<!-- Área de impressão (só aparece no print) -->
<div id="print-area"></div>

<script>
let labels = [];
let currentId = null;
let nextId = 1;

/* ---------- Storage ---------- */
function saveLabels() {
  localStorage.setItem('esfeus_labels', JSON.stringify({ labels, nextId }));
}
function loadLabels() {
  const raw = localStorage.getItem('esfeus_labels');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      labels = data.labels || [];
      nextId = data.nextId || 1;
    } catch(e) { labels = []; nextId = 1; }
  }
}

/* ---------- Encoding ---------- */
function b64enc(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function b64dec(str) { return JSON.parse(decodeURIComponent(escape(atob(str)))); }

function buildViewerUrl(d) {
  const base = (document.getElementById('base-url').value || window.location.href.split('#')[0]).trim();
  return base + '#e=' + b64enc({
    cli: d.cli, os: d.os, qty: d.qty, desc: d.desc, des: d.des,
    emb: d.emb, oc: d.oc, it: d.it, nf: d.nf, dt: d.dt
  });
}

/* ---------- CRUD ---------- */
function addLabel() {
  const l = { id: nextId++, cli:'', os:'', qty:'', desc:'', des:'', emb:'', oc:'', it:'', nf:'', dt:'' };
  labels.push(l);
  currentId = l.id;
  saveLabels();
  renderAll();
  document.getElementById('f-cli').focus();
}

function deleteLabel(id) {
  if (!confirm('Remover esta etiqueta?')) return;
  labels = labels.filter(l => l.id !== id);
  if (currentId === id) currentId = labels.length ? labels[0].id : null;
  saveLabels();
  renderAll();
}

function selectLabel(id) {
  currentId = id;
  renderAll();
}

function updateCurrent() {
  if (currentId === null) return;
  const l = labels.find(x => x.id === currentId);
  if (!l) return;
  ['cli','os','qty','desc','des','emb','oc','it','nf','dt'].forEach(f => {
    l[f] = document.getElementById('f-' + f).value;
  });
  saveLabels();
  renderList();
  renderPreview();
}

function clearAll() {
  if (!confirm('Apagar TODAS as etiquetas cadastradas?')) return;
  labels = [];
  currentId = null;
  nextId = 1;
  saveLabels();
  renderAll();
}

/* ---------- Rendering ---------- */
function renderList() {
  const list = document.getElementById('label-list');
  if (!labels.length) {
    list.innerHTML = '<div class="empty-list">Nenhuma etiqueta ainda. Clique em "+ Nova etiqueta".</div>';
    return;
  }
  list.innerHTML = labels.map(l =>
    '<div class="label-item ' + (l.id === currentId ? 'active' : '') + '" onclick="selectLabel(' + l.id + ')">' +
      '<div class="info">' +
        '<div class="info-os">' + (l.os || '(sem OS)') + '</div>' +
        '<div class="info-desc">' + (l.desc || '(sem descrição)') + ' · ' + (l.cli || '?') + '</div>' +
      '</div>' +
      '<button class="btn-delete" onclick="event.stopPropagation(); deleteLabel(' + l.id + ')" title="Remover">×</button>' +
    '</div>'
  ).join('');
}

function renderForm() {
  const l = labels.find(x => x.id === currentId);
  ['cli','os','qty','desc','des','emb','oc','it','nf','dt'].forEach(f => {
    const el = document.getElementById('f-' + f);
    el.value = l ? (l[f] || '') : '';
    el.disabled = !l;
  });
}

function renderPreview() {
  const l = labels.find(x => x.id === currentId);
  const empty = { cli:'', os:'', qty:'', desc:'', des:'', emb:'', oc:'', it:'', nf:'', dt:'' };
  const d = l || empty;
  ['cli','os','qty','desc','des','emb','oc','it','nf','dt'].forEach(f => {
    document.getElementById('v-' + f).textContent = d[f] || '';
  });

  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  if (l) {
    new QRCode(qrContainer, {
      text: buildViewerUrl(l),
      width: 140,
      height: 140,
      correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('qr-label').textContent = 'OS ' + (l.os || '(sem OS)');
  } else {
    document.getElementById('qr-label').textContent = 'Adicione uma etiqueta para gerar o QR';
  }
}

function renderAll() { renderList(); renderForm(); renderPreview(); }

/* ---------- Print ---------- */
function generatePrintQR(label) {
  const wrapper = document.createElement('div');
  wrapper.className = 'print-qr';

  const qrDiv = document.createElement('div');
  qrDiv.className = 'qr-container';
  wrapper.appendChild(qrDiv);

  new QRCode(qrDiv, {
    text: buildViewerUrl(label),
    width: 400,
    height: 400,
    correctLevel: QRCode.CorrectLevel.M
  });

  const info = document.createElement('div');
  info.className = 'qr-info';
  info.innerHTML = '<strong>' + (label.os || '(sem OS)') + '</strong>' +
                   (label.desc || '') + (label.cli ? ' · ' + label.cli : '');
  wrapper.appendChild(info);

  return wrapper;
}

function printCurrent() {
  const l = labels.find(x => x.id === currentId);
  if (!l) { alert('Selecione uma etiqueta primeiro.'); return; }
  const area = document.getElementById('print-area');
  area.className = 'single';
  area.innerHTML = '';
  area.appendChild(generatePrintQR(l));
  setTimeout(() => window.print(), 150);
}

function printAll() {
  if (!labels.length) { alert('Nenhuma etiqueta cadastrada.'); return; }
  const area = document.getElementById('print-area');
  area.className = '';
  area.innerHTML = '';
  labels.forEach(l => area.appendChild(generatePrintQR(l)));
  setTimeout(() => window.print(), 150);
}

function copyLink() {
  const l = labels.find(x => x.id === currentId);
  if (!l) { alert('Selecione uma etiqueta primeiro.'); return; }
  const url = buildViewerUrl(l);
  navigator.clipboard.writeText(url)
    .then(() => alert('Link copiado:\n' + url))
    .catch(() => prompt('Copie o link:', url));
}

function saveBaseUrl() {
  localStorage.setItem('esfeus_base_url', document.getElementById('base-url').value.trim());
  alert('URL do visualizador salva neste navegador.');
  if (currentId !== null) renderPreview();
}

/* ---------- Viewer mode (cliente escaneou) ---------- */
function activateViewerMode(data) {
  document.body.classList.add('viewer-mode');
  ['cli','os','qty','desc','des','emb','oc','it','nf','dt'].forEach(f => {
    const el = document.getElementById('v-' + f);
    if (el) el.textContent = data[f] || '';
  });
  document.title = 'Etiqueta ' + (data.os || '') + ' — ESFEUS';
}

/* ---------- Init ---------- */
(function init() {
  const savedUrl = localStorage.getItem('esfeus_base_url');
  if (savedUrl) document.getElementById('base-url').value = savedUrl;

  const hash = window.location.hash;
  if (hash.startsWith('#e=')) {
    try { activateViewerMode(b64dec(hash.substring(3))); return; }
    catch(e) { alert('QR inválido ou dados corrompidos.'); }
  }

  loadLabels();
  if (!labels.length) addLabel();
  else { currentId = labels[0].id; renderAll(); }
})();
</script>
</body>
</html>
